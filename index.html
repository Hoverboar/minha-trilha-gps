<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Trilha GPS</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}
html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#000;
    color:white;
}
body{position:relative}

/* MAPA: sempre ocupa 100% da tela */
#map{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:1;
}

/* Barra superior pequena, sobre o mapa */
.topo{
    position:fixed;
    top:8px;
    left:10px;
    right:10px;
    z-index:1000;
    pointer-events:none;
}
.statusBox{
    display:inline-block;
    max-width:92%;
    background:rgba(8,15,28,.82);
    border:1px solid rgba(255,255,255,.16);
    border-radius:16px;
    padding:8px 12px;
    box-shadow:0 4px 16px rgba(0,0,0,.38);
    backdrop-filter:blur(5px);
}
#status{
    font-size:18px;
    font-weight:bold;
    line-height:1.15;
}
#mensagem{
    margin-top:4px;
    color:#d1d5db;
    font-size:12px;
    line-height:1.2;
}
.coordenadas{
    position:fixed;
    top:70px;
    left:10px;
    z-index:1000;
    background:rgba(8,15,28,.72);
    border-radius:12px;
    padding:6px 9px;
    font-size:11px;
    line-height:1.35;
    color:#e5e7eb;
    box-shadow:0 3px 12px rgba(0,0,0,.30);
    pointer-events:none;
    backdrop-filter:blur(4px);
}
.coordenadas b{color:white}

/* Painel flutuante: não reduz o mapa */
.controles{
    position:fixed;
    left:10px;
    right:10px;
    bottom:8px;
    z-index:1000;
    background:rgba(7,14,27,.78);
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    padding:8px;
    box-shadow:0 -5px 25px rgba(0,0,0,.38);
    backdrop-filter:blur(5px);
}

/* Indicadores compactos */
.metricas{
    display:flex;
    gap:7px;
    margin-bottom:7px;
}
.metrica{
    flex:1;
    min-width:0;
    text-align:center;
    background:rgba(18,29,48,.90);
    border-radius:12px;
    padding:6px 3px;
}
.metrica b{
    display:block;
    font-size:20px;
    line-height:1.05;
}
.metrica span{
    color:#9ca3af;
    font-size:10px;
}

/* Botões sobre o mapa */
.botoes{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}
button{
    width:100%;
    padding:9px 5px;
    margin:0;
    border:0;
    border-radius:12px;
    font-size:13px;
    font-weight:bold;
    color:white;
    min-height:42px;
    box-shadow:0 2px 6px rgba(0,0,0,.30);
}
.gps{background:#2563eb;grid-column:1/-1}
.gravar{background:#f59e0b}
.parar{background:#374151}
.voltar{background:#2563eb}
.pararRetorno{background:#4b5563}
.limpar{background:#dc2626}

/* O zoom também fica sobre o mapa, sem criar espaço reservado */
.leaflet-control-zoom{
    margin-top:120px!important;
    margin-left:10px!important;
}
.leaflet-control-attribution{font-size:10px}

@media(max-height:700px){
    .topo{top:5px}
    .coordenadas{top:64px}
    .controles{
        bottom:5px;
        padding:6px;
        border-radius:16px;
    }
    .metricas{gap:5px;margin-bottom:5px}
    .metrica{padding:5px 2px}
    .metrica b{font-size:17px}
    button{
        min-height:37px;
        padding:7px 4px;
        font-size:12px;
    }
}

@media(min-width:700px){
    .controles{
        left:50%;
        right:auto;
        transform:translateX(-50%);
        width:620px;
    }
}
</style>
</head>

<body>
<div id="map"></div>
<div class="topo"><div class="statusBox">
<div id="status">🟡 Aguardando GPS</div>
<div id="mensagem">Toque em TESTAR GPS para iniciar.</div>
</div></div>
<div class="coordenadas">
LAT: <b id="lat">--</b><br>
LON: <b id="lon">--</b><br>
PREC: <b id="precisao">--</b> &nbsp; ALT: <b id="altitude">--</b>
</div>
<div class="controles">
<div class="metricas">
<div class="metrica"><b id="distancia">0 m</b><span>DISTÂNCIA</span></div>
<div class="metrica"><b id="velocidade">0.0 km/h</b><span>VELOCIDADE</span></div>
<div class="metrica"><b id="pontos">0</b><span>PONTOS</span></div>
</div>
<div class="botoes">
<button class="gps" onclick="testarGPS()">🛰️ TESTAR GPS</button>
<button class="gravar" onclick="iniciarGravacao()">🔴 INICIAR TRILHA</button>
<button class="parar" onclick="pararGravacao()">⏹ PARAR TRILHA</button>
<button class="voltar" onclick="iniciarRetorno()">🔵 VOLTAR PELO CAMINHO</button>
<button class="pararRetorno" onclick="pararRetorno()">⏹ PARAR RETORNO</button>
<button class="limpar" onclick="limparTrilha()">🗑️ LIMPAR TRILHA</button>
</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let mapa;
let marcador = null;
let circuloPrecisao = null;
let watchId = null;

let gravando = false;
let retornando = false;

let pontosTrilha = [];
let ultimoPonto = null;
let distanciaTotal = 0;
let ultimaPosicaoVelocidade = null;
let ultimaHoraVelocidade = null;

let linhaTrilha = null;
let linhaRetorno = null;
let marcadorInicio = null;

const CHAVE_TRILHA = "minha_trilha_gps";


// =====================================================
// MAPA
// =====================================================

function iniciarMapa(){

    mapa = L.map("map").setView(
        [-22.1547,-51.4534],
        16
    );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"&copy; OpenStreetMap"
        }
    ).addTo(mapa);

    linhaTrilha = L.polyline(
        [],
        {
            color:"#ff8c00",
            weight:6,
            opacity:0.98
        }
    ).addTo(mapa);

    linhaRetorno = L.polyline(
        [],
        {
            color:"#2563eb",
            weight:6,
            opacity:0.95,
            dashArray:"10,8"
        }
    ).addTo(mapa);

    carregarTrilha();
}


// =====================================================
// DISTÂNCIA GPS
// =====================================================

function distanciaMetros(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371000;
    const rad = Math.PI / 180;

    const dLat =
        (lat2-lat1) * rad;

    const dLon =
        (lon2-lon1) * rad;

    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2) +

        Math.cos(lat1*rad) *
        Math.cos(lat2*rad) *

        Math.sin(dLon/2) *
        Math.sin(dLon/2);

    return R *
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );
}


// =====================================================
// GPS
// =====================================================

function testarGPS(){

    if(!navigator.geolocation){

        document.getElementById("status")
            .textContent =
            "🔴 GPS NÃO DISPONÍVEL";

        return;
    }

    if(watchId !== null){

        navigator.geolocation.clearWatch(
            watchId
        );
    }

    document.getElementById("status")
        .textContent =
        "🟡 PROCURANDO GPS...";

    document.getElementById("mensagem")
        .textContent =
        "Aguarde alguns segundos...";

    watchId =
        navigator.geolocation.watchPosition(

            atualizarGPS,

            erroGPS,

            {
                enableHighAccuracy:true,
                maximumAge:1000,
                timeout:15000
            }

        );
}


// =====================================================
// POSIÇÃO RECEBIDA
// =====================================================

function atualizarGPS(pos){

    const c = pos.coords;

    const lat = c.latitude;
    const lon = c.longitude;

    // Velocidade em km/h. Usa a velocidade fornecida pelo GPS quando disponível;
    // caso contrário, calcula pela distância entre duas posições.
    let velocidadeKmh = 0;

    if(c.speed != null && Number.isFinite(c.speed) && c.speed >= 0){
        velocidadeKmh = c.speed * 3.6;
    }else if(ultimaPosicaoVelocidade && ultimaHoraVelocidade){
        const agora = Date.now();
        const segundos = (agora - ultimaHoraVelocidade) / 1000;
        if(segundos > 0){
            const metros = distanciaMetros(
                ultimaPosicaoVelocidade[0],
                ultimaPosicaoVelocidade[1],
                lat,
                lon
            );
            velocidadeKmh = (metros / segundos) * 3.6;
        }
    }

    // Evita valores absurdos causados por erro momentâneo do GPS.
    if(!Number.isFinite(velocidadeKmh) || velocidadeKmh > 250){
        velocidadeKmh = 0;
    }

    document.getElementById("velocidade")
        .textContent = velocidadeKmh.toFixed(1) + " km/h";

    ultimaPosicaoVelocidade = [lat, lon];
    ultimaHoraVelocidade = Date.now();

    document.getElementById("status")
        .textContent =
        gravando
        ? "🔴 GRAVANDO TRILHA"
        : "🟢 GPS FUNCIONANDO";

    document.getElementById("mensagem")
        .textContent =
        gravando
        ? "Registrando sua posição..."
        : "Posição recebida corretamente.";

    document.getElementById("lat")
        .textContent =
        lat.toFixed(6);

    document.getElementById("lon")
        .textContent =
        lon.toFixed(6);

    document.getElementById("precisao")
        .textContent =
        Math.round(c.accuracy) + " m";

    document.getElementById("altitude")
        .textContent =
        c.altitude == null
        ? "--"
        : Math.round(c.altitude) + " m";


    const ponto = [lat,lon];


    // marcador
    if(!marcador){

        marcador =
            L.marker(ponto)
            .addTo(mapa);

        marcador.bindPopup(
            "📍 Você está aqui"
        );

    }else{

        marcador.setLatLng(
            ponto
        );
    }


    // círculo de precisão
    if(circuloPrecisao){

        circuloPrecisao.setLatLng(
            ponto
        );

        circuloPrecisao.setRadius(
            c.accuracy
        );

    }else{

        circuloPrecisao =
            L.circle(
                ponto,
                {
                    radius:c.accuracy,
                    color:"#22c55e",
                    fillOpacity:0.10
                }
            ).addTo(mapa);
    }


    // centraliza no usuário
    mapa.setView(
        ponto,
        17
    );


    // grava a posição
    if(gravando){

        registrarPonto(
            lat,
            lon
        );
    }

    // acompanha o retorno pelo caminho gravado
    if(retornando){

        atualizarRetorno(
            lat,
            lon
        );
    }
}


// =====================================================
// GRAVAÇÃO
// =====================================================

function registrarPonto(
    lat,
    lon
){

    if(ultimoPonto){

        const distancia =
            distanciaMetros(
                ultimoPonto[0],
                ultimoPonto[1],
                lat,
                lon
            );


        // Ignora movimentos menores que 5 metros
        if(distancia < 5){

            return;
        }


        distanciaTotal +=
            distancia;
    }


    ultimoPonto =
        [lat,lon];


    pontosTrilha.push({

        lat:lat,
        lon:lon,

        hora:
            new Date()
            .toISOString()

    });


    linhaTrilha.setLatLngs(

        pontosTrilha.map(
            p => [p.lat,p.lon]
        )

    );


    atualizarMetricas();

    salvarTrilha();
}


// =====================================================
// INICIAR TRILHA
// =====================================================

function iniciarGravacao(){

    if(retornando){

        pararRetorno();
    }

    if(!navigator.geolocation){

        alert(
            "GPS não disponível."
        );

        return;
    }


    if(watchId === null){

        testarGPS();
    }


    gravando = true;

    // Se o GPS já entregou uma posição, começa a trilha imediatamente.
    if(marcador){
        const p = marcador.getLatLng();
        if(p && pontosTrilha.length === 0){
            registrarPonto(p.lat, p.lng);
        }
    }

    document.getElementById("status")
        .textContent =
        "🔴 GRAVANDO TRILHA";

    document.getElementById("mensagem")
        .textContent =
        "Caminhe normalmente. O caminho será desenhado no mapa.";
}


// =====================================================
// PARAR TRILHA
// =====================================================

function pararGravacao(){

    gravando = false;


    document.getElementById("status")
        .textContent =
        watchId !== null
        ? "🟢 GPS FUNCIONANDO"
        : "⏹ GPS PARADO";


    document.getElementById("mensagem")
        .textContent =
        "Trilha parada e salva neste celular.";
}



// =====================================================
// RETORNO PELO CAMINHO GRAVADO
// =====================================================

function iniciarRetorno(){

    if(gravando){

        alert(
            "Pare a gravação da trilha antes de iniciar o retorno."
        );

        return;
    }

    if(pontosTrilha.length < 2){

        alert(
            "Ainda não existe uma trilha suficiente para retornar."
        );

        return;
    }

    retornando = true;

    // Desenha a trilha de retorno em azul.
    const caminhoVolta =
        [...pontosTrilha]
        .reverse()
        .map(
            p => [p.lat,p.lon]
        );

    linhaRetorno.setLatLngs(
        caminhoVolta
    );

    // Marca o ponto inicial da trilha.
    const inicio = pontosTrilha[0];

    if(marcadorInicio){

        marcadorInicio.setLatLng(
            [inicio.lat,inicio.lon]
        );

    }else{

        marcadorInicio =
            L.circleMarker(
                [inicio.lat,inicio.lon],
                {
                    radius:8,
                    color:"#16a34a",
                    fillColor:"#22c55e",
                    fillOpacity:1,
                    weight:3
                }
            ).addTo(mapa);

        marcadorInicio.bindPopup(
            "🏁 Ponto inicial"
        );
    }

    document.getElementById("status")
        .textContent =
        "🔵 RETORNO ATIVO";

    document.getElementById("mensagem")
        .textContent =
        "Siga a linha azul até o ponto inicial.";

    atualizarRetorno(
        null,
        null
    );
}


function atualizarRetorno(
    lat,
    lon
){

    if(!retornando){

        return;
    }

    // Quando chamado sem posição, apenas prepara a mensagem.
    if(lat === null || lon === null){

        document.getElementById("mensagem")
            .textContent =
            "Siga a linha azul até o ponto inicial.";

        return;
    }

    if(!pontosTrilha.length){

        return;
    }

    // Encontra o ponto gravado mais próximo da posição atual.
    let indiceMaisProximo = 0;
    let menorDistancia = Infinity;

    for(
        let i = 0;
        i < pontosTrilha.length;
        i++
    ){

        const d =
            distanciaMetros(
                lat,
                lon,
                pontosTrilha[i].lat,
                pontosTrilha[i].lon
            );

        if(d < menorDistancia){

            menorDistancia = d;
            indiceMaisProximo = i;
        }
    }

    // Soma a distância restante até o primeiro ponto.
    let restante = menorDistancia;

    for(
        let i = indiceMaisProximo;
        i > 0;
        i--
    ){

        restante +=
            distanciaMetros(
                pontosTrilha[i].lat,
                pontosTrilha[i].lon,
                pontosTrilha[i-1].lat,
                pontosTrilha[i-1].lon
            );
    }

    let textoDistancia;

    if(restante < 1000){

        textoDistancia =
            Math.round(restante) + " m";

    }else{

        textoDistancia =
            (restante / 1000).toFixed(2) + " km";
    }

    if(menorDistancia <= 12){

        document.getElementById("mensagem")
            .textContent =
            "🏁 Você está no caminho. Faltam " +
            textoDistancia +
            " até o ponto inicial.";

    }else{

        document.getElementById("mensagem")
            .textContent =
            "🔵 Retorno ativo — faltam " +
            textoDistancia +
            ". Siga a linha azul.";
    }

    // Chegou ao ponto inicial.
    const distanciaInicio =
        distanciaMetros(
            lat,
            lon,
            pontosTrilha[0].lat,
            pontosTrilha[0].lon
        );

    if(distanciaInicio <= 10){

        document.getElementById("status")
            .textContent =
            "🏁 CHEGOU AO INÍCIO";

        document.getElementById("mensagem")
            .textContent =
            "Você chegou ao ponto inicial da trilha.";

        retornando = false;
    }
}


function pararRetorno(){

    retornando = false;

    if(linhaRetorno){

        linhaRetorno.setLatLngs([]);
    }

    document.getElementById("status")
        .textContent =
        watchId !== null
        ? "🟢 GPS FUNCIONANDO"
        : "⏹ GPS PARADO";

    document.getElementById("mensagem")
        .textContent =
        "Retorno parado. A trilha continua salva neste celular.";
}

// =====================================================
// MÉTRICAS
// =====================================================

function atualizarMetricas(){

    let texto;

    if(distanciaTotal < 1000){

        texto =
            Math.round(
                distanciaTotal
            ) + " m";

    }else{

        texto =
            (
                distanciaTotal / 1000
            ).toFixed(2) + " km";
    }


    document.getElementById("distancia")
        .textContent =
        texto;


    document.getElementById("pontos")
        .textContent =
        pontosTrilha.length;
}


// =====================================================
// SALVAR
// =====================================================

function salvarTrilha(){

    const dados = {

        pontos:pontosTrilha,

        distancia:distanciaTotal,

        data:
            new Date()
            .toISOString()

    };


    localStorage.setItem(

        CHAVE_TRILHA,

        JSON.stringify(dados)

    );
}


// =====================================================
// CARREGAR TRILHA
// =====================================================

function carregarTrilha(){

    const dados =
        localStorage.getItem(
            CHAVE_TRILHA
        );


    if(!dados){

        return;
    }


    try{

        const obj =
            JSON.parse(dados);


        pontosTrilha =
            obj.pontos || [];


        distanciaTotal =
            obj.distancia || 0;


        linhaTrilha.setLatLngs(

            pontosTrilha.map(
                p => [p.lat,p.lon]
            )

        );


        atualizarMetricas();


        if(pontosTrilha.length){

            const inicio =
                pontosTrilha[0];

            marcadorInicio =
                L.circleMarker(
                    [inicio.lat,inicio.lon],
                    {
                        radius:8,
                        color:"#16a34a",
                        fillColor:"#22c55e",
                        fillOpacity:1,
                        weight:3
                    }
                ).addTo(mapa);

            marcadorInicio.bindPopup(
                "🏁 Ponto inicial"
            );

            const ultimo =
                pontosTrilha[
                    pontosTrilha.length-1
                ];


            ultimoPonto =
                [
                    ultimo.lat,
                    ultimo.lon
                ];
        }

    }catch(e){

        console.log(
            "Erro ao carregar trilha:",
            e
        );
    }
}


// =====================================================
// LIMPAR
// =====================================================

function limparTrilha(){

    if(gravando || retornando){

        alert(
            "Pare a gravação ou o retorno antes de limpar."
        );

        return;
    }

    if(!confirm(
        "Apagar a trilha salva neste celular?"
    )){

        return;
    }

    pontosTrilha = [];

    distanciaTotal = 0;

    ultimoPonto = null;

    linhaTrilha.setLatLngs([]);

    if(linhaRetorno){

        linhaRetorno.setLatLngs([]);
    }

    if(marcadorInicio){

        mapa.removeLayer(
            marcadorInicio
        );

        marcadorInicio = null;
    }

    localStorage.removeItem(
        CHAVE_TRILHA
    );

    atualizarMetricas();

    document.getElementById("mensagem")
        .textContent =
        "Trilha apagada.";
}


// =====================================================
// ERRO GPS
// =====================================================

function erroGPS(err){

    let texto =
        "Erro ao obter GPS.";


    if(err.code === 1){

        texto =
            "Permissão de localização negada.";

    }else if(err.code === 2){

        texto =
            "Posição indisponível.";

    }else if(err.code === 3){

        texto =
            "Tempo esgotado para obter GPS.";
    }


    document.getElementById("status")
        .textContent =
        "🔴 ERRO GPS";


    document.getElementById("mensagem")
        .textContent =
        texto;
}


// inicia
iniciarMapa();

</script>

</body>
</html>
