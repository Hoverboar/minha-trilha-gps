<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minha Trilha GPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box} body{margin:0;background:#0b1425;color:#fff;font-family:Arial,sans-serif}
header{height:76px;padding:18px 20px;border-bottom:1px solid #26334a;font-size:27px;font-weight:700}
.screen{display:none;min-height:calc(100vh - 76px)} .screen.active{display:block}
.home{padding:30px 20px;text-align:center}.home h1{font-size:34px;margin:45px 0 8px}.home p{color:#aab5c8;font-size:18px}
.status{margin:35px auto 28px;max-width:620px;padding:18px;border:1px solid #2b3a55;border-radius:22px;background:#162238}
.btn{width:100%;max-width:620px;border:0;border-radius:22px;padding:22px;margin:9px 0;font-size:22px;font-weight:700;color:white;background:#2864e6}
.btn.orange{background:#f6a000}.btn.gray{background:#566171}.btn.purple{background:#823be8}.btn.red{background:#df2424}
.back{position:absolute;left:16px;top:21px;font-size:30px;cursor:pointer}
#map{height:calc(100vh - 76px);min-height:500px}.mapWrap{position:relative}
.panel{position:absolute;z-index:1000;left:16px;right:16px;bottom:14px;background:#0e192cdd;padding:12px;border-radius:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#17243a;padding:10px;border-radius:15px;text-align:center}.stat b{font-size:24px;display:block}.stat small{color:#aab5c8}
.mapBtns{position:absolute;z-index:1100;top:14px;right:14px;display:flex;gap:8px}.mapBtn{border:0;border-radius:14px;padding:12px 15px;background:#17243ae8;color:white;font-weight:bold}
.mapMsg{position:absolute;z-index:1100;top:14px;left:14px;background:#132039e8;padding:13px 16px;border-radius:16px;font-weight:bold}
.bottomActions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottomActions button{padding:16px;border:0;border-radius:15px;color:#fff;font-size:17px;font-weight:bold}.start{background:#f6a000}.stop{background:#596575}.mark{background:#823be8}.clear{background:#df2424}
.list{padding:18px}.item{background:#17243a;border:1px solid #2a3b57;border-radius:16px;padding:16px;margin-bottom:10px}.item b{font-size:21px}.item small{display:block;color:#aab5c8;margin-top:7px}.item button{margin-top:10px;border:0;border-radius:10px;padding:10px 14px;background:#2864e6;color:#fff;font-weight:bold}
input[type=file]{display:none}.empty{text-align:center;color:#aab5c8;padding:50px 20px}
.localItem{display:flex;justify-content:space-between;gap:10px;align-items:center}
@media(max-width:500px){header{font-size:23px}.home h1{font-size:30px}.panel{left:10px;right:10px}.stat b{font-size:21px}}
</style>
</head>
<body>
<header>🧭 Minha Trilha GPS</header>

<section id="home" class="screen active">
<div class="home">
<h1>🗺️ Minhas Trilhas</h1><p>Grave, marque pontos e acompanhe o caminho.</p>
<div class="status" id="homeStatus">⚪ <b>PRONTO</b><br><span style="color:#aab5c8">Nenhuma trilha sendo gravada.</span></div>
<button class="btn orange" onclick="criarTrilha()">🔴 CRIAR TRILHA</button>
<button class="btn" onclick="mostrarTrilhas()">🗺️ TRILHAS</button>
<button class="btn purple" onclick="mostrarLocais()">📍 LOCAIS</button>
<button class="btn gray" onclick="document.getElementById('gpxInput').click()">📥 IMPORTAR GPX</button>
<input id="gpxInput" type="file" accept=".gpx,application/gpx+xml,text/xml" onchange="importarGPX(event)">
</div>
</section>

<section id="tracks" class="screen">
<div class="back" onclick="voltarHome()">‹</div>
<header style="padding-left:55px">🗺️ Trilhas</header>
<div class="list" id="tracksList"></div>
</section>

<section id="locals" class="screen">
<div class="back" onclick="voltarHome()">‹</div>
<header style="padding-left:55px">📍 Locais</header>
<div class="list" id="localsList"></div>
</section>

<section id="mapScreen" class="screen mapWrap">
<div id="map"></div>
<div class="mapMsg" id="mapMsg">⚪ PRONTO<br><small>GPS aguardando.</small></div>
<div class="mapBtns"><button class="mapBtn" onclick="voltarHome()">← Voltar</button></div>
<div class="panel">
<div class="stat"><b id="dist">0 m</b><small>DISTÂNCIA</small></div>
<div class="stat"><b id="speed">0.0 km/h</b><small>VELOCIDADE</small></div>
<div class="stat"><b id="gpsPts">0</b><small>PONTOS GPS</small></div>
<div class="bottomActions">
<button class="start" id="startBtn" onclick="alternarGravacao()">🔴 INICIAR</button>
<button class="stop" onclick="pararGravacao()">◻️ PARAR</button>
<button class="mark" onclick="marcarPonto()">📍 MARCAR PONTO</button>
<button class="clear" onclick="limparMapa()">🗑️ LIMPAR</button>
</div>
</div>
</section>

<section id="viewScreen" class="screen mapWrap">
<div id="viewMap"></div>
<div class="mapBtns"><button class="mapBtn" onclick="mostrarTrilhas()">← Voltar</button></div>
<div class="mapMsg" id="viewTitle">Trilha</div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map, viewMap, watchId=null, gravando=false, currentTrack=null, routeLine=null, currentMarker=null;
let pontos=[], locais=JSON.parse(localStorage.getItem('gps_locais')||'[]');
let tracks=JSON.parse(localStorage.getItem('gps_tracks')||'[]');
let lastPos=null, totalDist=0;

function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function voltarHome(){if(gravando){alert('Pare a gravação antes de sair.');return}show('home');atualizarHome()}
function atualizarHome(){document.getElementById('homeStatus').innerHTML=gravando?'🔴 <b>GRAVANDO</b><br><span style="color:#ffb0b0">Trilha em andamento.</span>':'⚪ <b>PRONTO</b><br><span style="color:#aab5c8">Nenhuma trilha sendo gravada.</span>'}
function criarTrilha(){
 let nome=prompt('Nome da trilha:'); if(!nome)return;
 if(gravando){alert('Já existe uma gravação em andamento.');return}
 currentTrack={id:Date.now(),nome,points:[],locais:[],data:new Date().toISOString(),dist:0};
 pontos=[];totalDist=0;lastPos=null;show('mapScreen');initMap();iniciarGPS();atualizarUI();
}
function initMap(){
 if(map)return;
 map=L.map('map').setView([-21.4586,-51.9168],15);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
}
function iniciarGPS(){
 if(watchId!==null)return;
 if(!navigator.geolocation){document.getElementById('mapMsg').innerHTML='🔴 GPS não disponível';return}
 watchId=navigator.geolocation.watchPosition(pos=>{
  const {latitude:lat,longitude:lon,accuracy,speed}=pos.coords;
  document.getElementById('mapMsg').innerHTML=(gravando?'🔴 <b>GRAVANDO</b>':'🟢 <b>GPS FUNCIONANDO</b>')+
  `<br><small>LAT: ${lat.toFixed(6)} | LON: ${lon.toFixed(6)} | PREC: ${Math.round(accuracy)} m</small>`;
  if(!map)return;
  if(!currentMarker) currentMarker=L.marker([lat,lon]).addTo(map);
  else currentMarker.setLatLng([lat,lon]);
  if(gravando){
   const p=[lat,lon]; if(lastPos){let d=distM(lastPos[0],lastPos[1],lat,lon);if(d>=2){totalDist+=d;currentTrack.points.push({lat,lon});lastPos=p;redesenhar();}}
   else{currentTrack.points.push({lat,lon});lastPos=p;redesenhar();}
   map.panTo(p,{animate:false});
  }
  document.getElementById('speed').textContent=((speed||0)*3.6).toFixed(1)+' km/h';
  atualizarUI();
 },err=>{document.getElementById('mapMsg').innerHTML='🔴 <b>ERRO GPS</b><br><small>'+err.message+'</small>'},{enableHighAccuracy:true,maximumAge:1000,timeout:10000});
}
function alternarGravacao(){if(!currentTrack){criarTrilha();return}if(!gravando){gravando=true;atualizarUI();atualizarHome()}else pararGravacao()}
function pararGravacao(){
 if(!currentTrack)return;
 gravando=false;
 if(currentTrack.points.length>=2){currentTrack.dist=totalDist;tracks.push(currentTrack);localStorage.setItem('gps_tracks',JSON.stringify(tracks));}
 currentTrack=null;lastPos=null;totalDist=0;atualizarHome();
 document.getElementById('startBtn').textContent='🔴 INICIAR';
 document.getElementById('mapMsg').innerHTML='⚪ <b>NÃO GRAVANDO</b><br><small>GPS funcionando. Pronto para gravar.</small>';
}
function redesenhar(){
 if(routeLine)map.removeLayer(routeLine);
 if(currentTrack&&currentTrack.points.length)routeLine=L.polyline(currentTrack.points,{color:'#ff3b18',weight:5}).addTo(map);
 document.getElementById('gpsPts').textContent=currentTrack?currentTrack.points.length:0;
 document.getElementById('dist').textContent=totalDist<1000?Math.round(totalDist)+' m':(totalDist/1000).toFixed(2)+' km';
}
function atualizarUI(){if(!currentTrack)return;document.getElementById('startBtn').textContent=gravando?'◻️ GRAVANDO':'🔴 INICIAR';document.getElementById('gpsPts').textContent=currentTrack.points.length;document.getElementById('dist').textContent=totalDist<1000?Math.round(totalDist)+' m':(totalDist/1000).toFixed(2)+' km'}
function marcarPonto(){
 if(!map){return}
 if(!currentMarker){alert('Aguardando posição GPS.');return}
 const ll=currentMarker.getLatLng(), nome=prompt('Nome do local/ponto:');if(!nome)return;
 const item={id:Date.now(),nome,lat:ll.lat,lon:ll.lng,data:new Date().toLocaleString('pt-BR'),trackId:currentTrack?currentTrack.id:null};
 locais.push(item);localStorage.setItem('gps_locais',JSON.stringify(locais));
 L.marker([ll.lat,ll.lng]).addTo(map).bindPopup('<b>📍 '+nome+'</b>').openPopup();
 if(currentTrack){currentTrack.locais=currentTrack.locais||[];currentTrack.locais.push(item)}
}
function limparMapa(){if(!confirm('Limpar a trilha desenhada nesta tela?'))return;if(routeLine){map.removeLayer(routeLine);routeLine=null}if(currentTrack){currentTrack.points=[];totalDist=0;lastPos=null}atualizarUI()}
function mostrarTrilhas(){show('tracks');const el=document.getElementById('tracksList');if(!tracks.length){el.innerHTML='<div class="empty">Nenhuma trilha salva.</div>';return}el.innerHTML=tracks.map((t,i)=>`<div class="item"><b>${esc(t.nome)}</b><small>${new Date(t.data).toLocaleString('pt-BR')} • ${(t.dist/1000).toFixed(3)} km • ${t.points.length} pontos GPS</small><button onclick="abrirTrilha(${i})">ABRIR TRILHA</button></div>`).join('')}
function mostrarLocais(){show('locals');const el=document.getElementById('localsList');if(!locais.length){el.innerHTML='<div class="empty">Nenhum local marcado.</div>';return}el.innerHTML=locais.map((p,i)=>`<div class="item localItem"><div><b>📍 ${esc(p.nome)}</b><small>${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}<br>${p.data}</small></div><button onclick="abrirLocal(${i})">MAPA</button></div>`).join('')}
function abrirLocal(i){const p=locais[i];show('viewScreen');initViewMap();viewMap.setView([p.lat,p.lon],17);L.marker([p.lat,p.lon]).addTo(viewMap).bindPopup('<b>📍 '+esc(p.nome)+'</b>').openPopup()}
function abrirTrilha(i){
 const t=tracks[i];show('viewScreen');initViewMap();viewMap.eachLayer(l=>{if(l instanceof L.Polyline||l instanceof L.Marker)viewMap.removeLayer(l)});
 const line=L.polyline(t.points,{color:'#ff2020',weight:6}).addTo(viewMap);
 t.points.forEach((p,idx)=>{if(idx%1===0)L.circleMarker([p.lat,p.lon],{radius:3,color:'#ff2020',fillColor:'#ff2020',fillOpacity:1}).addTo(viewMap)});
 (t.locais||locais.filter(p=>p.trackId===t.id)).forEach(p=>L.marker([p.lat,p.lon]).addTo(viewMap).bindPopup('📍 '+esc(p.nome)));
 if(t.points.length)viewMap.fitBounds(line.getBounds(),{padding:[20,20]});
 document.getElementById('viewTitle').textContent='🗺️ '+t.nome;
}
function initViewMap(){if(viewMap)return;viewMap=L.map('viewMap').setView([-21.4586,-51.9168],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(viewMap)}
function importarGPX(ev){
 const file=ev.target.files[0];if(!file)return;
 const reader=new FileReader();reader.onload=e=>{
  const xml=new DOMParser().parseFromString(e.target.result,'text/xml');
  const trks=[...xml.querySelectorAll('trk')];
  let imported=0;
  trks.forEach((trk,idx)=>{
   let nome=trk.querySelector('name')?.textContent?.trim()||`Trilha GPX ${idx+1}`;
   let points=[...trk.querySelectorAll('trkpt')].map(p=>({lat:parseFloat(p.getAttribute('lat')),lon:parseFloat(p.getAttribute('lon'))})).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon));
   if(points.length>=2){let d=0;for(let i=1;i<points.length;i++)d+=distM(points[i-1].lat,points[i-1].lon,points[i].lat,points[i].lon);tracks.push({id:Date.now()+idx,nome,points,locais:[],data:new Date().toISOString(),dist:d});imported++}
  });
  localStorage.setItem('gps_tracks',JSON.stringify(tracks));alert(imported+' trilha(s) importada(s) separadamente.');ev.target.value='';mostrarTrilhas();
 };reader.readAsText(file)
}
function distM(a,b,c,d){const R=6371000,rad=Math.PI/180,x=(c-a)*rad,y=(d-b)*rad;const q=Math.sin(x/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
atualizarHome();
</script>
</body>
</html>
