<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Minha Trilha GPS</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#0b1220;
    color:white;
}

body{
    display:flex;
    flex-direction:column;
}

/* Cabeçalho */
.topo{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:#111a2b;
    border-bottom:1px solid #26344d;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.status{
    width:14px;
    height:14px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 10px #22c55e;
}

/* Área principal */
.principal{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:25px;
}

/* Botões */
.botao{
    width:min(90vw,430px);
    min-height:105px;
    border:0;
    border-radius:24px;
    color:white;
    font-size:25px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    box-shadow:0 8px 18px rgba(0,0,0,.30);
    cursor:pointer;
}

.botao:active{
    transform:scale(.97);
}

.gravar{
    background:#f59e0b;
}

.locais{
    background:#2563eb;
}

.trilhas{
    background:#7c3aed;
}

.icone{
    font-size:36px;
}

.rodape{
    text-align:center;
    padding:14px;
    color:#8f9bb0;
    font-size:14px;
    background:#111a2b;
}

/* telas futuras */
.tela{
    display:none;
    position:absolute;
    inset:0;
    background:#0b1220;
    z-index:10;
    flex-direction:column;
}

.tela.ativa{
    display:flex;
}

.telaTopo{
    height:70px;
    display:flex;
    align-items:center;
    gap:15px;
    padding:0 18px;
    background:#111a2b;
    border-bottom:1px solid #26344d;
}

.voltar{
    background:none;
    border:0;
    color:white;
    font-size:32px;
}

.titulo{
    font-size:23px;
    font-weight:bold;
}

.conteudo{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#9ca8bb;
    text-align:center;
    padding:30px;
    font-size:18px;
}
</style>
</head>

<body>

<header class="topo">
    <div class="logo">🧭 Minha Trilha GPS</div>
    <div class="status" title="GPS"></div>
</header>

<main class="principal">

    <button class="botao gravar" onclick="abrirGravar()">
        <span class="icone">🔴</span>
        <span>GRAVAR TRILHA</span>
    </button>

    <button class="botao locais" onclick="abrirTela('locais')">
        <span class="icone">📍</span>
        <span>LOCAIS</span>
    </button>

    <button class="botao trilhas" onclick="abrirTela('trilhas')">
        <span class="icone">🗺️</span>
        <span>TRILHAS</span>
    </button>

</main>

<footer class="rodape">
    GPS • Trilhas • Pontos marcados
</footer>


<!-- Tela de gravação -->
<section id="telaGravar" class="tela">
    <div class="telaTopo">
        <button class="voltar" onclick="voltarInicio()">‹</button>
        <div class="titulo">Gravar Trilha</div>
    </div>

    <div class="conteudo">
        Aqui vamos colocar o mapa e a gravação da trilha.
    </div>
</section>


<!-- Tela de locais -->
<section id="telaLocais" class="tela">
    <div class="telaTopo">
        <button class="voltar" onclick="voltarInicio()">‹</button>
        <div class="titulo">Locais</div>
    </div>

    <div class="conteudo">
        Aqui vamos colocar os pontos marcados pelo usuário.
    </div>
</section>


<!-- Tela de trilhas -->
<section id="telaTrilhas" class="tela">
    <div class="telaTopo">
        <button class="voltar" onclick="voltarInicio()">‹</button>
        <div class="titulo">Trilhas</div>
    </div>

    <div class="conteudo">
        Aqui vamos colocar o Gerenciador de Rotas e as trilhas salvas.
    </div>
</section>


<script>
function abrirGravar(){
    document.getElementById("telaGravar").classList.add("ativa");
}

function abrirTela(tipo){

    document.getElementById("telaLocais").classList.remove("ativa");
    document.getElementById("telaTrilhas").classList.remove("ativa");

    if(tipo === "locais"){
        document.getElementById("telaLocais").classList.add("ativa");
    }

    if(tipo === "trilhas"){
        document.getElementById("telaTrilhas").classList.add("ativa");
    }
}

function voltarInicio(){
    document.querySelectorAll(".tela").forEach(t =>
        t.classList.remove("ativa")
    );
}
</script>

</body>
</html>
