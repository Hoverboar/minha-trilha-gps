<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minha Trilha GPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#0b1220;color:#fff}
button{font-family:inherit;border:0;cursor:pointer;color:#fff}
.hidden{display:none!important}

/* PRINCIPAL */
#telaPrincipal{
  width:100%;height:100%;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0c1527,#111b2e);
}
.cabecalho{
  height:72px;display:flex;align-items:center;padding:0 20px;
  font-size:25px;font-weight:800;background:#0d1729;
  border-bottom:1px solid #1f2b40;
}
.principalConteudo{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:25px;gap:18px;max-width:620px;width:100%;margin:auto;
}
.logoCard{
  text-align:center;margin-bottom:8px;
}
.logoCard .icone{font-size:58px}
.logoCard h1{margin:7px 0 3px;font-size:29px}
.logoCard p{margin:0;color:#9ca8ba;font-size:15px}
.estadoPrincipal{
  background:#172238;border-radius:18px;padding:14px 16px;
  text-align:center;border:1px solid #25334a;
}
.estadoPrincipal .linhaEstado{font-size:19px;font-weight:800}
.estadoPrincipal small{display:block;color:#9ca8ba;margin-top:5px}
.btnPrincipal{
  width:100%;min-height:76px;border-radius:18px;font-size:21px;font-weight:800;
  box-shadow:0 5px 14px rgba(0,0,0,.25);
}
.btnCriar{background:#f59e0b}
.btnTrilhas{background:#2563eb}
.btnImportar{background:#4b5563}
.btnPrincipal:active{transform:scale(.99)}
.rodape{padding:12px;text-align:center;color:#69778b;font-size:12px}

/* LISTA DE TRILHAS */
#telaTrilhas{
  width:100%;height:100%;display:flex;flex-direction:column;background:#0b1220;
}
.barra{
  height:64px;display:flex;align-items:center;gap:12px;padding:0 14px;
  background:#0d1729;border-bottom:1px solid #22304a;
}
.btnVoltar{background:transparent;font-size:31px;width:42px;height:44px}
.barraTitulo{font-size:22px;font-weight:800}
.lista{
  flex:1;overflow-y:auto;padding:12px;
}
.itemTrilha{
  background:#172238;border:1px solid #293851;border-radius:15px;
  padding:14px;margin-bottom:10px;
}
.itemTitulo{font-size:18px;font-weight:800}
.itemInfo{color:#aab5c5;font-size:13px;margin-top:6px}
.itemAcoes{display:flex;gap:8px;margin-top:11px}
.btnMini{
  flex:1;padding:11px;border-radius:11px;font-weight:800;background:#2563eb;
}
.btnMini.continuar{background:#f59e0b}
.vazio{text-align:center;color:#8e9bad;padding:45px 20px}

/* MAPA / GRAVAÇÃO */
#telaMapa{position:fixed;inset:0;background:#000}
#map{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.mapaBarra{
  position:absolute;top:8px;left:8px;right:8px;height:58px;z-index:1000;
  display:flex;align-items:center;gap:8px;pointer-events:none;
}
.mapaBarra .btnVoltar{
  pointer-events:auto;background:rgba(8,15,28,.82);border-radius:13px;
}
.nomeMapa{
  pointer-events:none;background:rgba(8,15,28,.82);padding:11px 14px;
  border-radius:13px;font-size:19px;font-weight:800;
  max-width:calc(100% - 60px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.statusMapa{
  position:absolute;top:73px;left:10px;z-index:1000;
  background:rgba(8,15,28,.84);border-radius:14px;padding:9px 12px;
  box-shadow:0 4px 14px rgba(0,0,0,.35);font-weight:800;
}
.statusMapa small{display:block;color:#c5ceda;font-weight:400;margin-top:3px}
.infoMapa{
  position:absolute;left:10px;right:10px;bottom:9px;z-index:1000;
  background:rgba(7,14,27,.84);border:1px solid rgba(255,255,255,.10);
  border-radius:19px;padding:8px;backdrop-filter:blur(5px);
}
.metricas{display:flex;gap:7px;margin-bottom:7px}
.metrica{flex:1;text-align:center;background:rgba(18,29,48,.93);border-radius:12px;padding:7px 3px}
.metrica b{display:block;font-size:19px;line-height:1.1}
.metrica span{display:block;color:#9ca3af;font-size:10px;margin-top:2px}
.botoesMapa{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.btnMapa{min-height:44px;border-radius:12px;font-size:14px;font-weight:800}
.btnGravar{background:#f59e0b}
.btnGravando{background:#dc2626}
.btnParar{background:#4b5563}
.btnMarcar{background:#7c3aed}
.btnLimpar{background:#b91c1c}
.btnMapa:active{transform:scale(.99)}
.leaflet-control-attribution{font-size:9px}

@media(max-height:700px){
 .cabecalho{height:58px;font-size:21px}
 .principalConteudo{padding:18px;gap:12px}
 .logoCard .icone{font-size:42px}
 .logoCard h1{font-size:25px}
 .btnPrincipal{min-height:57px;font-size:18px}
 .infoMapa{bottom:5px}
 .metrica{padding:5px 2px}.metrica b{font-size:17px}
 .btnMapa{min-height:39px;font-size:12px}
}
</style>
</head>
<body>

<!-- ================= PRINCIPAL ================= -->
<section id="telaPrincipal">
  <div class="cabecalho">🧭 Minha Trilha GPS</div>

  <div class="principalConteudo">
    <div class="logoCard">
      <div class="icone">🗺️</div>
      <h1>Minhas Trilhas</h1>
      <p>Grave, marque pontos e acompanhe o caminho.</p>
    </div>

    <div class="estadoPrincipal">
      <div id="estadoPrincipalTexto" class="linhaEstado">⚪ PRONTO</div>
      <small id="estadoPrincipalSub">Nenhuma trilha sendo gravada.</small>
    </div>

    <button id="btnCriarPrincipal" class="btnPrincipal btnCriar" onclick="acaoCriarTrilha()">
      🔴 CRIAR TRILHA
    </button>

    <button class="btnPrincipal btnTrilhas" onclick="abrirListaTrilhas()">
      🗺️ TRILHAS
    </button>

    <button class="btnPrincipal btnImportar" onclick="abrirImportadorGPX()">
      📥 IMPORTAR GPX
    </button>

    <div class="rodape">As trilhas ficam salvas localmente neste celular.</div>
    <input id="inputGPX" type="file" accept=".gpx,application/gpx+xml,text/xml,application/xml" class="hidden" onchange="importarGPX(event)">
  </div>
</section>

<!-- ================= LISTA ================= -->
<section id="telaTrilhas" class="hidden">
  <div class="barra">
    <button class="btnVoltar" onclick="voltarPrincipal()">‹</button>
    <div class="barraTitulo">Trilhas</div>
    <button class="btnMini" style="margin-left:auto;flex:0 0 auto;padding:9px 12px;background:#4b5563" onclick="abrirImportadorGPX()">📥 GPX</button>
  </div>
  <div id="listaTrilhas" class="lista"></div>
</section>

<!-- ================= MAPA ================= -->
<section id="telaMapa" class="hidden">
  <div id="map"></div>

  <div class="mapaBarra">
    <button class="btnVoltar" onclick="voltarPrincipal()">‹</button>
    <div id="nomeMapa" class="nomeMapa">Trilha</div>
  </div>

  <div class="statusMapa">
    <span id="statusMapa">⚪ NÃO GRAVANDO</span>
    <small id="mensagemMapa">GPS aguardando...</small>
  </div>

  <div class="infoMapa">
    <div class="metricas">
      <div class="metrica"><b id="distancia">0 m</b><span>DISTÂNCIA</span></div>
      <div class="metrica"><b id="velocidade">0.0 km/h</b><span>VELOCIDADE</span></div>
      <div class="metrica"><b id="pontos">0</b><span>PONTOS GPS</span></div>
    </div>
    <div class="botoesMapa">
      <button id="btnGravarMapa" class="btnMapa btnGravar" onclick="acaoBotaoGravacao()">🔴 INICIAR</button>
      <button class="btnMapa btnParar" onclick="pararGravacao()">⏹ PARAR</button>
      <button class="btnMapa btnMarcar" onclick="marcarPonto()">📍 MARCAR PONTO</button>
      <button class="btnMapa btnLimpar" onclick="limparAtual()">🗑️ LIMPAR</button>
    </div>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let mapa=null;
let marcador=null;
let circuloPrecisao=null;
let watchId=null;

let gravando=false;
let pontosTrilha=[];
let ultimoPonto=null;
let distanciaTotal=0;
let ultimaPosicaoVelocidade=null;
let ultimaHoraVelocidade=null;
let linhaTrilha=null;
let marcadorInicio=null;
let trilhaAtualId=null;
let nomeTrilhaAtual="";
let modoVisualizacao="principal";

const CHAVE_TRILHAS="minha_trilhas_gps_v2";
const CHAVE_ATIVA="minha_trilha_ativa_gps_v2";

function el(id){return document.getElementById(id)}

function obterTrilhas(){
  try{return JSON.parse(localStorage.getItem(CHAVE_TRILHAS)||"[]")}catch(e){return []}
}
function salvarLista(trilhas){
  localStorage.setItem(CHAVE_TRILHAS,JSON.stringify(trilhas));
}

function formatarDistancia(m){
  return m<1000 ? Math.round(m)+" m" : (m/1000).toFixed(2)+" km";
}

function distanciaMetros(lat1,lon1,lat2,lon2){
  const R=6371000, rad=Math.PI/180;
  const dLat=(lat2-lat1)*rad, dLon=(lon2-lon1)*rad;
  const a=Math.sin(dLat/2)**2+
    Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function iniciarMapa(){
  mapa=L.map("map").setView([-21.4586,-51.9167],16);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,attribution:"&copy; OpenStreetMap"
  }).addTo(mapa);

  linhaTrilha=L.polyline([],{color:"#ff3b00",weight:6,opacity:.98}).addTo(mapa);
  iniciarGPS();
}

function iniciarGPS(){
  if(!navigator.geolocation){
    el("statusMapa").textContent="🔴 GPS NÃO DISPONÍVEL";
    return;
  }
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(atualizarGPS,erroGPS,{
    enableHighAccuracy:true,maximumAge:1000,timeout:15000
  });
}

function atualizarGPS(pos){
  const c=pos.coords, lat=c.latitude, lon=c.longitude;

  let velocidade=0;
  if(c.speed!=null && Number.isFinite(c.speed) && c.speed>=0){
    velocidade=c.speed*3.6;
  }else if(ultimaPosicaoVelocidade && ultimaHoraVelocidade){
    const agora=Date.now(), segundos=(agora-ultimaHoraVelocidade)/1000;
    if(segundos>0) velocidade=distanciaMetros(
      ultimaPosicaoVelocidade.lat,ultimaPosicaoVelocidade.lon,lat,lon
    )/segundos*3.6;
  }
  ultimaPosicaoVelocidade={lat,lon};
  ultimaHoraVelocidade=Date.now();

  el("velocidade").textContent=velocidade.toFixed(1)+" km/h";

  if(marcador) mapa.removeLayer(marcador);
  marcador=L.marker([lat,lon]).addTo(mapa);

  if(c.accuracy){
    if(circuloPrecisao) mapa.removeLayer(circuloPrecisao);
    circuloPrecisao=L.circle([lat,lon],{radius:c.accuracy,color:"#22c55e",weight:2,fillOpacity:.08}).addTo(mapa);
  }

  if(gravarandoOuNao()){
    registrarPonto(lat,lon);
  }

  el("statusMapa").textContent=gravando ? "■ GRAVANDO TRILHA" : "⚪ NÃO GRAVANDO";
  el("mensagemMapa").textContent=gravando
    ? "A trilha está sendo salva neste celular."
    : "GPS funcionando. Pronto para gravar.";
}

function gravarandoOuNao(){return gravando===true}

function iniciarNovaTrilha(){
  let nome=prompt("Nome da trilha:");
  if(nome===null)return;
  nome=nome.trim();
  if(!nome) nome="Trilha "+new Date().toLocaleString("pt-BR");

  if(gravando){
    alert("Já existe uma trilha sendo gravada.");
    return;
  }

  trilhaAtualId=Date.now().toString();
  nomeTrilhaAtual=nome;
  pontosTrilha=[];
  ultimoPonto=null;
  distanciaTotal=0;
  ultimaPosicaoVelocidade=null;
  ultimaHoraVelocidade=null;
  linhaTrilha.setLatLngs([]);
  if(marcadorInicio){mapa.removeLayer(marcadorInicio);marcadorInicio=null}

  gravando=true;
  salvarAtiva();
  atualizarTelaMapa();
  abrirMapa();
  el("mensagemMapa").textContent="Caminhe normalmente. O caminho será desenhado.";
}

function acaoCriarTrilha(){
  if(gravando){
    abrirMapa();
    return;
  }
  iniciarNovaTrilha();
}

function acaoBotaoGravacao(){
  if(gravando){
    pararGravacao();
  }else{
    if(nomeTrilhaAtual){
      gravando=true;
      salvarAtiva();
      atualizarTelaMapa();
    }else{
      iniciarNovaTrilha();
    }
  }
}

function registrarPonto(lat,lon){
  if(!gravando)return;

  if(ultimoPonto){
    const d=distanciaMetros(ultimoPonto.lat,ultimoPonto.lon,lat,lon);
    if(d<5)return;
    distanciaTotal+=d;
  }

  ultimoPonto={lat,lon};
  pontosTrilha.push({
    lat,lon,
    hora:new Date().toISOString()
  });

  linhaTrilha.setLatLngs(pontosTrilha.map(p=>[p.lat,p.lon]));
  atualizarMetricas();
  salvarAtiva();
}

function marcarPonto(){
  if(!marcador){
    alert("Aguarde o GPS obter sua posição.");
    return;
  }
  const p=marcador.getLatLng();
  const nome=prompt("Nome deste ponto (opcional):","Ponto "+(pontosTrilha.length+1));
  if(nome===null)return;

  const pontosMarcados=obterMarcados();
  pontosMarcados.push({
    lat:p.lat,lon:p.lng,
    nome:nome.trim()||"Ponto",
    hora:new Date().toISOString()
  });
  localStorage.setItem("minha_pontos_gps_v2",JSON.stringify(pontosMarcados));

  L.circleMarker([p.lat,p.lng],{
    radius:7,color:"#7c3aed",fillColor:"#a855f7",fillOpacity:1,weight:3
  }).addTo(mapa).bindPopup("📍 "+(nome.trim()||"Ponto"));
}

function obterMarcados(){
  try{return JSON.parse(localStorage.getItem("minha_pontos_gps_v2")||"[]")}catch(e){return []}
}

function pararGravacao(){
  if(!gravando)return;
  gravando=false;
  salvarTrilhaAtual();
  localStorage.removeItem(CHAVE_ATIVA);
  atualizarTelaMapa();
  atualizarPrincipal();
  renderizarLista();
}

function salvarAtiva(){
  if(!trilhaAtualId)return;
  localStorage.setItem(CHAVE_ATIVA,JSON.stringify({
    id:trilhaAtualId,nome:nomeTrilhaAtual,pontos:pontosTrilha,
    distancia:distanciaTotal,dataInicio:new Date().toISOString()
  }));
}

function salvarTrilhaAtual(){
  if(!trilhaAtualId || !nomeTrilhaAtual)return;
  const lista=obterTrilhas();
  const obj={
    id:trilhaAtualId,nome:nomeTrilhaAtual,pontos:pontosTrilha,
    distancia:distanciaTotal,
    data:new Date().toISOString()
  };
  const i=lista.findIndex(t=>t.id===trilhaAtualId);
  if(i>=0)lista[i]=obj;else lista.unshift(obj);
  salvarLista(lista);
}

function carregarAtiva(){
  try{
    const obj=JSON.parse(localStorage.getItem(CHAVE_ATIVA)||"null");
    if(!obj)return;
    trilhaAtualId=obj.id;
    nomeTrilhaAtual=obj.nome;
    pontosTrilha=obj.pontos||[];
    distanciaTotal=obj.distancia||0;
    ultimoPonto=pontosTrilha.length ? pontosTrilha[pontosTrilha.length-1] : null;
    gravando=true;
    linhaTrilha.setLatLngs(pontosTrilha.map(p=>[p.lat,p.lon]));
    atualizarMetricas();
  }catch(e){}
}

function abrirMapa(){
  modoVisualizacao="mapa";
  el("telaPrincipal").classList.add("hidden");
  el("telaTrilhas").classList.add("hidden");
  el("telaMapa").classList.remove("hidden");
  el("nomeMapa").textContent=nomeTrilhaAtual||"Trilhas";
  atualizarTelaMapa();
  setTimeout(()=>mapa.invalidateSize(),80);
  if(marcador)mapa.setView(marcador.getLatLng(),17);
  else if(pontosTrilha.length)mapa.setView([pontosTrilha[pontosTrilha.length-1].lat,pontosTrilha[pontosTrilha.length-1].lon],17);
}

function abrirListaTrilhas(){
  // Durante a gravação, o botão TRILHAS abre diretamente o mapa grande,
  // para acompanhar o caminho sendo desenhado em tempo real.
  if(gravando){
    abrirMapa();
    return;
  }

  modoVisualizacao="lista";
  el("telaPrincipal").classList.add("hidden");
  el("telaMapa").classList.add("hidden");
  el("telaTrilhas").classList.remove("hidden");
  renderizarLista();
}

function renderizarLista(){
  const lista=el("listaTrilhas");
  const todas=obterTrilhas();

  const minhas=todas.filter(t=>t.origem!=="GPX");
  const importadas=todas.filter(t=>t.origem==="GPX");

  lista.innerHTML="";

  // Trilhas que estão sendo gravadas ficam sempre no topo.
  if(gravando){
    const ativo=document.createElement("div");
    ativo.className="itemTrilha";
    ativo.innerHTML=`
      <div class="itemTitulo">■ ${esc(nomeTrilhaAtual)}</div>
      <div class="itemInfo">GRAVANDO AGORA · ${formatarDistancia(distanciaTotal)} · ${pontosTrilha.length} pontos</div>
      <div class="itemAcoes">
        <button class="btnMini continuar" onclick="abrirMapa()">ABRIR GRAVAÇÃO</button>
      </div>`;
    lista.appendChild(ativo);
  }

  if(minhas.length){
    const titulo=document.createElement("div");
    titulo.style.cssText="font-size:18px;font-weight:800;padding:12px 4px 8px";
    titulo.textContent="🛤️ MINHAS TRILHAS";
    lista.appendChild(titulo);

    minhas.forEach(t=>adicionarItemTrilha(lista,t));
  }

  if(importadas.length){
    const titulo=document.createElement("div");
    titulo.style.cssText="font-size:18px;font-weight:800;padding:20px 4px 8px";
    titulo.textContent="📥 GPX IMPORTADOS";
    lista.appendChild(titulo);

    importadas.forEach(t=>adicionarItemTrilha(lista,t));
  }

  if(!minhas.length && !importadas.length && !gravando){
    lista.innerHTML='<div class="vazio">Nenhuma trilha salva ainda.<br><br>Use <b>CRIAR TRILHA</b> ou <b>IMPORTAR GPX</b>.</div>';
  }
}

function adicionarItemTrilha(lista,t){
  const div=document.createElement("div");
  div.className="itemTrilha";

  const origem=t.origem==="GPX" ? "📥 GPX IMPORTADO" : "🛤️ TRILHA GRAVADA";

  div.innerHTML=`
    <div class="itemTitulo">${t.origem==="GPX" ? "📥" : "🛤️"} ${esc(t.nome)}</div>
    <div class="itemInfo">${origem} · ${formatarDistancia(t.distancia||0)} · ${(t.pontos||[]).length} pontos · ${new Date(t.data).toLocaleString("pt-BR")}</div>
    <div class="itemAcoes">
      <button class="btnMini" onclick="abrirTrilhaSalva('${t.id}')">VER TRILHA</button>
      <button class="btnMini" style="background:#b91c1c" onclick="apagarTrilha('${t.id}')">APAGAR</button>
    </div>`;

  lista.appendChild(div);
}

function abrirTrilhaSalva(id){
  const t=obterTrilhas().find(x=>x.id===id);
  if(!t)return;
  if(gravando && id===trilhaAtualId){
    abrirMapa();return;
  }
  nomeTrilhaAtual=t.nome;
  pontosTrilha=t.pontos||[];
  distanciaTotal=t.distancia||0;
  ultimoPonto=pontosTrilha.length?pontosTrilha[pontosTrilha.length-1]:null;
  gravando=false;
  linhaTrilha.setLatLngs(pontosTrilha.map(p=>[p.lat,p.lon]));
  atualizarMetricas();
  abrirMapa();
  el("statusMapa").textContent="🗺️ TRILHA SALVA";
  el("mensagemMapa").textContent="Visualizando uma trilha já gravada.";
}

function apagarTrilha(id){
  if(!confirm("Apagar esta trilha?"))return;
  salvarLista(obterTrilhas().filter(t=>t.id!==id));
  renderizarLista();
}

function limparAtual(){
  if(gravando){
    alert("Pare a gravação antes de limpar.");
    return;
  }
  if(!confirm("Limpar a trilha da tela?"))return;
  pontosTrilha=[];
  distanciaTotal=0;
  ultimoPonto=null;
  nomeTrilhaAtual="";
  trilhaAtualId=null;
  linhaTrilha.setLatLngs([]);
  atualizarMetricas();
  atualizarPrincipal();
}

function atualizarMetricas(){
  el("distancia").textContent=formatarDistancia(distanciaTotal);
  el("pontos").textContent=pontosTrilha.length;
}

function atualizarTelaMapa(){
  el("nomeMapa").textContent=nomeTrilhaAtual||"Trilhas";
  if(gravando){
    el("statusMapa").textContent="■ GRAVANDO TRILHA";
    el("mensagemMapa").textContent="Caminhe normalmente. A trilha está sendo salva.";
    el("btnGravarMapa").textContent="■ GRAVANDO";
    el("btnGravarMapa").className="btnMapa btnGravando";
  }else{
    el("statusMapa").textContent="⚪ NÃO GRAVANDO";
    el("mensagemMapa").textContent="Trilha parada e salva neste celular.";
    el("btnGravarMapa").textContent="🔴 INICIAR";
    el("btnGravarMapa").className="btnMapa btnGravar";
  }
}

function atualizarPrincipal(){
  if(gravando){
    el("estadoPrincipalTexto").textContent="■ GRAVANDO TRILHA";
    el("estadoPrincipalTexto").style.color="#ef4444";
    el("estadoPrincipalSub").textContent=nomeTrilhaAtual+" · "+formatarDistancia(distanciaTotal);
    el("btnCriarPrincipal").textContent="■ GRAVANDO — ABRIR";
  }else{
    el("estadoPrincipalTexto").textContent="⚪ PRONTO";
    el("estadoPrincipalTexto").style.color="";
    el("estadoPrincipalSub").textContent="Nenhuma trilha sendo gravada.";
    el("btnCriarPrincipal").textContent="🔴 CRIAR TRILHA";
  }
}

function voltarPrincipal(){
  el("telaMapa").classList.add("hidden");
  el("telaTrilhas").classList.add("hidden");
  el("telaPrincipal").classList.remove("hidden");
  modoVisualizacao="principal";
  atualizarPrincipal();
}

function erroGPS(err){
  el("statusMapa").textContent="🔴 ERRO GPS";
  el("mensagemMapa").textContent=
    err.code===1?"Permissão de localização negada.":
    err.code===2?"Posição indisponível.":
    "Tempo esgotado para obter GPS.";
}


function abrirImportadorGPX(){
  const input=el("inputGPX");
  if(input){
    input.value="";
    input.click();
  }
}

function importarGPX(event){
  const arquivo=event.target.files && event.target.files[0];
  if(!arquivo)return;

  const leitor=new FileReader();
  leitor.onload=function(){
    try{
      const texto=String(leitor.result||"");
      const doc=new DOMParser().parseFromString(texto,"application/xml");

      if(doc.querySelector("parsererror")){
        throw new Error("GPX inválido.");
      }

      const trackPoints=[...doc.querySelectorAll("trkpt")];
      const routePoints=[...doc.querySelectorAll("rtept")];
      const wayPoints=[...doc.querySelectorAll("wpt")];

      const pontos=trackPoints.length ? trackPoints : (routePoints.length ? routePoints : wayPoints);

      if(!pontos.length){
        alert("Não encontrei pontos de GPS neste arquivo GPX.");
        return;
      }

      const nomeNoArquivo=arquivo.name.replace(/\.gpx$/i,"").trim();
      const nomeGPX=nomeNoArquivo || "Trilha importada";

      const coords=pontos.map(pt=>({
        lat:parseFloat(pt.getAttribute("lat")),
        lon:parseFloat(pt.getAttribute("lon")),
        hora:(pt.querySelector("time")||{}).textContent || null
      })).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon));

      if(coords.length<2){
        alert("O GPX precisa ter pelo menos 2 posições válidas.");
        return;
      }

      let dist=0;
      for(let i=1;i<coords.length;i++){
        dist+=distanciaMetros(
          coords[i-1].lat,coords[i-1].lon,
          coords[i].lat,coords[i].lon
        );
      }

      const lista=obterTrilhas();
      const id="gpx_"+Date.now();

      lista.unshift({
        id:id,
        nome:nomeGPX,
        pontos:coords,
        distancia:dist,
        data:new Date().toISOString(),
        origem:"GPX"
      });

      salvarLista(lista);

      alert("GPX importado com sucesso:\\n"+nomeGPX+"\\n"+formatarDistancia(dist));

      renderizarLista();
      abrirListaTrilhas();
    }catch(e){
      console.error(e);
      alert("Não foi possível importar este GPX.");
    }
  };
  leitor.onerror=function(){alert("Erro ao ler o arquivo GPX.")};
  leitor.readAsText(arquivo);
}

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

/* Recupera gravação que estava em andamento antes de fechar/trocar a tela. */
function iniciar(){
  iniciarMapa();
  carregarAtiva();
  atualizarPrincipal();
  renderizarLista();
}
iniciar();
</script>
